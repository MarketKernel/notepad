[package]
name = "notepad"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.35.0"
memchr = "2.8.3"
rfd = "0.17.2"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSError", "NSGeometry", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSApplication", "NSButton", "NSButtonCell", "NSCell", "NSColor", "NSControl", "NSPanel", "NSResponder", "NSSavePanel", "NSView", "NSWindow"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
egui_kittest = { version = "0.35", features = ["eframe", "wgpu", "snapshot"] }
