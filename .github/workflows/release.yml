name: Release

# A `v*` tag builds the macOS and Windows archives and publishes them as a
# GitHub release. Running the workflow by hand (Actions → Release → Run
# workflow) only builds them and attaches them to the run as artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches Cargo.toml version
        if: github.ref_type == 'tag'
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION"
            exit 1
          fi

  macos:
    needs: check-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --locked

      - name: Bundle Notepad.app (arm64)
        run: ./build_scripts/bundle-macos.sh

      - name: Bundle Notepad.app (universal)
        run: ./build_scripts/bundle-macos.sh --universal

      # ditto keeps the bundle's permissions and metadata intact.
      - name: Zip
        run: |
          ditto -c -k --keepParent target/release/Notepad.app "Notepad-$GITHUB_REF_NAME-macos-arm64.zip"
          ditto -c -k --keepParent target/universal-apple-darwin/release/Notepad.app "Notepad-$GITHUB_REF_NAME-macos-universal.zip"

      - uses: actions/upload-artifact@v5
        with:
          name: macos
          path: Notepad-*.zip
          if-no-files-found: error

  windows:
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # ARM64 is cross-compiled; the runner image has the MSVC ARM64 tools.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --locked

      - name: Build (x64)
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Build (arm64)
        run: cargo build --release --locked --target aarch64-pc-windows-msvc

      - name: Zip
        shell: pwsh
        run: |
          foreach ($arch in @{ x64 = 'x86_64'; arm64 = 'aarch64' }.GetEnumerator()) {
            $exe = "target/$($arch.Value)-pc-windows-msvc/release/notepad.exe"
            Compress-Archive -Path $exe -DestinationPath "Notepad-$env:GITHUB_REF_NAME-windows-$($arch.Key).zip"
          }

      - uses: actions/upload-artifact@v5
        with:
          name: windows
          path: Notepad-*.zip
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Notepad $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            Notepad-*.zip
