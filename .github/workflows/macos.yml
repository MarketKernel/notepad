name: macOS release

on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches Cargo.toml version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --locked

      - name: Bundle Notepad.app (arm64)
        run: ./build_scripts/bundle-macos.sh

      - name: Bundle Notepad.app (universal)
        run: ./build_scripts/bundle-macos.sh --universal

      # ditto keeps the bundle's permissions and metadata intact.
      - name: Zip
        run: |
          ditto -c -k --keepParent target/release/Notepad.app "Notepad-$GITHUB_REF_NAME-macos-arm64.zip"
          ditto -c -k --keepParent target/universal-apple-darwin/release/Notepad.app "Notepad-$GITHUB_REF_NAME-macos-universal.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Notepad $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            Notepad-*.zip
